<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cesar Saavedra</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1e293b, #334155);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 48px 40px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    text-align: center;
  }
  .avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2563eb, #1e40af);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 32px;
    font-weight: 700;
    margin: 0 auto 20px;
  }
  h1 {
    font-size: 24px;
    color: #0f172a;
    margin-bottom: 6px;
  }
  .role {
    color: #2563eb;
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 18px;
  }
  .description {
    color: #475569;
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 24px;
  }
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .tag {
    background: #eff6ff;
    color: #1e40af;
    font-size: 13px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 999px;
  }
  footer {
    margin-top: 28px;
    font-size: 11px;
    color: #94a3b8;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">CS</div>
    <h1>Cesar Saavedra</h1>
    <div class="role">Learning &amp; Development Specialist · DOXA Talent</div>
    <div class="description">
      I design and facilitate instructor-led training for DOXA's teams, helping people build the skills they need to do their jobs with confidence.
    </div>
    <div class="tags">
      <span class="tag">ILT Facilitation</span>
      <span class="tag">Training Design</span>
      <span class="tag">L&amp;D Programs</span>
    </div>
    <footer>Drafted with AI assistance</footer>
  </div>
</body>
</html>
